name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-tauri:
    name: ${{ matrix.name }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            platform: macos-latest
            args: --target aarch64-apple-darwin
          - name: macOS (Intel)
            platform: macos-latest
            args: --target x86_64-apple-darwin
          - name: Linux
            platform: ubuntu-22.04
            args: --bundles deb,appimage
          - name: Windows
            platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - run: npm ci

      - name: Build and create draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "n8n Studio v__VERSION__"
          releaseBody: |
            Panel de escritorio para probar y monitorear automatizaciones locales de n8n.

            ### Incluye

            - Backend async en Rust con health check, latencia y versión de n8n.
            - Runner de webhooks con validación de JSON y respuesta completa.
            - Configuración persistente con credenciales fuera del webview.
            - Workflows de ejemplo de `echo` y `sync-contacts`.

            ### Instalación

            1. Descargá el instalador de tu plataforma.
            2. Levantá n8n con Docker: `docker compose up -d`.
            3. Importá los workflows de ejemplo: `npm run n8n:import`.

            > Los binarios se generan sin firma de código. macOS puede pedir confirmación en Privacidad y seguridad, y Windows puede mostrar SmartScreen.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
