[package]
name = "n8n-studio"
version = "1.0.0"
description = "Desktop control panel for local n8n workflows"
authors = ["Marcos Bentivegna"]
license = "MIT"
repository = "https://github.com/MarcosBentivegna/tauri-n8n-app-template"
edition = "2021"
rust-version = "1.90"

[lib]
name = "n8n_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync"] }
thiserror = "2"
url = "2"
dotenvy = "0.15"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
